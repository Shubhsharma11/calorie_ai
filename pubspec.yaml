name: calorie_ai
description: MyCaloriePal - nutrition tracking app.
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.12.0-210.2.beta

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.7.2
  http: ^1.2.0
  http_parser: ^4.1.2
  cronet_http: ^1.5.0
  intl: ^0.20.2
  image_picker: ^1.1.2
  image_picker_android: ^0.8.13+19
  image_picker_platform_interface: ^2.11.1
  mobile_scanner: ^7.0.0
  shared_preferences: ^2.5.5
  flutter_svg: ^2.3.0
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.4
  firebase_messaging: ^16.4.1
  firebase_analytics: ^12.0.0
  
  flutter_local_notifications: ^19.4.0
  google_sign_in: ^7.2.0
 
  sign_in_with_apple: ^6.1.0
  pedometer: ^4.2.0
  permission_handler: ^12.0.3
  health: ^13.3.1
  lottie: ^3.5.0
  image_cropper: ^12.2.1
  firebase_crashlytics: ^5.2.7
  firebase_performance: ^0.11.4+6
  share_plus: ^12.0.2
  url_launcher: ^6.3.1
  package_info_plus: ^9.0.1
  device_info_plus: ^12.4.0
  image: ^4.9.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"
  min_sdk_android: 26

# Native launch splash (Android / iOS). Regenerate with:
#   dart run flutter_native_splash:create
# Re-apply iOS LaunchScreen.storyboard after that (168x120 centered logo).
flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#000000"
  image: assets/image/splash_full.png
  image_dark: assets/image/splash_full.png
  android: true
  ios: true
  web: false
  fullscreen: false
  ios_content_mode: scaleAspectFit
  android_12:
    color: "#FFFFFF"
    color_dark: "#000000"
    # Full Fitbuddyai (icon + wordmark). No icon_background_color so Android
    # uses the larger 768px circle instead of the 640px one.
    image: assets/image/splash_android12.png
    image_dark: assets/image/splash_android12.png

flutter:
  # Firebase plugins require iOS 15+. Flutter's generated SPM package
  # always resets to iOS 13.0 on pub get/clean and only bumps during
  # `flutter build ios`, which breaks Xcode opens. Use CocoaPods instead.
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - assets/image/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/font/Manrope-ExtraLight.ttf
          weight: 200
        - asset: assets/font/Manrope-Light.ttf                   
          weight: 300
        - asset: assets/font/Manrope-Regular.ttf
          weight: 400
        - asset: assets/font/Manrope-Medium.ttf
          weight: 500
        - asset: assets/font/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/font/Manrope-Bold.ttf
          weight: 700
        - asset: assets/font/Manrope-ExtraBold.ttf
          weight: 800
